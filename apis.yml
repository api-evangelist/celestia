  description: >-
    JSON-RPC methods in the blob module of celestia-node. Submit blobs to one or more namespaces with
    blob.Submit, retrieve them by height with blob.Get and blob.GetAll, generate inclusion proofs with
    blob.GetProof, check inclusion with blob.Included, and subscribe to namespace blobs with blob.Subscribe.
    The canonical surface for rollups and applications publishing data to Celestia.
