naftiko: 1.0.0-alpha2
info:
  label: Celestia Node API — DA Interface
  description: 'Celestia Node DA JSON-RPC capability implementing the modular Data Availability interface used by Rollkit, Optimism Alt-DA, Arbitrum Nitro DAS, and other rollup frameworks.'
  tags:
    - Celestia
    - DataAvailability
    - Rollup
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
  - namespace: env
    keys:
      CELESTIA_NODE_AUTH_TOKEN: CELESTIA_NODE_AUTH_TOKEN
      CELESTIA_NODE_URL: CELESTIA_NODE_URL
capability:
  consumes:
    - type: http
      namespace: da-da
      baseUri: ${CELESTIA_NODE_URL}
      description: Celestia Node JSON-RPC over HTTP for the da.* namespace.
      resources:
        - name: da-submit
          path: /
          operations:
            - name: dasubmit
              method: POST
              description: Submit blobs through the modular DA interface via da.Submit.
              outputRawFormat: json
              outputParameters:
                - name: ids
                  type: array
                  value: $.result
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
        - name: da-get
          path: /
          operations:
            - name: daget
              method: POST
              description: Retrieve blobs by ID through the modular DA interface via da.Get.
              outputRawFormat: json
              outputParameters:
                - name: blobs
                  type: array
                  value: $.result
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
    authentication:
      type: bearer
