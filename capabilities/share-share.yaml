naftiko: 1.0.0-alpha2
info:
  label: Celestia Node API — Share
  description: 'Celestia Node Share JSON-RPC capability. Access share-level data, retrieve the extended data square, and fetch namespaced data per height.'
  tags:
    - Celestia
    - Share
    - DataAvailability
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
  - namespace: env
    keys:
      CELESTIA_NODE_AUTH_TOKEN: CELESTIA_NODE_AUTH_TOKEN
      CELESTIA_NODE_URL: CELESTIA_NODE_URL
capability:
  consumes:
    - type: http
      namespace: share-share
      baseUri: ${CELESTIA_NODE_URL}
      description: Celestia Node JSON-RPC over HTTP for the share.* namespace.
      resources:
        - name: share-getnamespacedata
          path: /
          operations:
            - name: getnamespacedata
              method: POST
              description: Retrieve all shares for a namespace at a height via share.GetNamespaceData.
              outputRawFormat: json
              outputParameters:
                - name: namespaceData
                  type: array
                  value: $.result
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
    authentication:
      type: bearer
