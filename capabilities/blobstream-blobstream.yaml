naftiko: 1.0.0-alpha2
info:
  label: Celestia Node API — Blobstream
  description: 'Celestia Node Blobstream JSON-RPC capability. Produce inclusion proofs against Blobstream data commitments so EVM chains can verify blob inclusion via the Blobstream(X) bridge.'
  tags:
    - Celestia
    - Blobstream
    - Bridge
    - EVM
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
  - namespace: env
    keys:
      CELESTIA_NODE_AUTH_TOKEN: CELESTIA_NODE_AUTH_TOKEN
      CELESTIA_NODE_URL: CELESTIA_NODE_URL
capability:
  consumes:
    - type: http
      namespace: blobstream-blobstream
      baseUri: ${CELESTIA_NODE_URL}
      description: Celestia Node JSON-RPC over HTTP for the blobstream.* namespace.
      resources:
        - name: blobstream-getdataroottupleroot
          path: /
          operations:
            - name: getdataroottupleroot
              method: POST
              description: Generate a Blobstream data root tuple root via blobstream.GetDataRootTupleRoot.
              outputRawFormat: json
              outputParameters:
                - name: root
                  type: string
                  value: $.result
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
        - name: blobstream-getshareproof
          path: /
          operations:
            - name: getshareproof
              method: POST
              description: Generate a share proof for blobstream verification via blobstream.GetShareProof.
              outputRawFormat: json
              outputParameters:
                - name: proof
                  type: object
                  value: $.result
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
    authentication:
      type: bearer
