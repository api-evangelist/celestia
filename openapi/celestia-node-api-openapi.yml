openapi: 3.1.0
info:
  title: Celestia Blob Node API
  version: 0.30.x
  description: 'JSON-RPC methods in the `blob` module of celestia-node. Used to submit, retrieve,

    and prove blobs of arbitrary data published to the Celestia data availability layer

    against one or more namespaces. Blobs are the canonical payload unit for rollups

    and other applications using Celestia for DA.

    '
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Celestia Labs
    url: https://celestia.org
servers:
- url: http://localhost:26658
  description: Default celestia-node JSON-RPC endpoint (light/bridge/full)
tags:
- name: Node
  description: Node introspection and auth-token management.
paths:
  /:
    post:
      tags:
      - Node
      summary: Invoke Node JSON-RPC Method
      description: 'Exposes the `node.*` namespace including `node.Info`, `node.Ready`,

        `node.LogLevelSet`, `node.AuthVerify`, and `node.AuthNew`.

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
components:
  schemas:
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
        id: {}
        result: {}
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      - id
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - node.Info
          - node.Ready
          - node.LogLevelSet
          - node.AuthVerify
          - node.AuthNew
        params:
          type: array
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
