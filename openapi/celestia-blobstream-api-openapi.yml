openapi: 3.1.0
info:
  title: Celestia Node Blob Blobstream API
  version: 0.30.x
  description: 'JSON-RPC methods in the `blob` module of celestia-node. Used to submit, retrieve,

    and prove blobs of arbitrary data published to the Celestia data availability layer

    against one or more namespaces. Blobs are the canonical payload unit for rollups

    and other applications using Celestia for DA.

    '
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Celestia Labs
    url: https://celestia.org
servers:
- url: http://localhost:26658
  description: Default celestia-node JSON-RPC endpoint (light/bridge/full)
tags:
- name: Blobstream
  description: Inclusion proofs for the EVM Blobstream(X) bridge.
paths:
  /:
    post:
      tags:
      - Blobstream
      summary: Invoke Blobstream JSON-RPC Method
      description: 'Exposes the `blobstream.*` namespace including `blobstream.GetDataRootTupleRoot`,

        `blobstream.GetDataRootTupleInclusionProof`, and

        `blobstream.GetShareProof`.

        '
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
components:
  schemas:
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
        id: {}
        result: {}
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      - id
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - blobstream.GetDataRootTupleRoot
          - blobstream.GetDataRootTupleInclusionProof
          - blobstream.GetShareProof
        params:
          type: array
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
