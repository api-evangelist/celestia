openapi: 3.1.0
info:
  title: Celestia Node DAS API
  version: 0.30.x
  description: |
    JSON-RPC methods in the `das` module of celestia-node. Provides operational
    introspection over the Data Availability Sampling subsystem that light nodes
    run to probabilistically verify that block data has been published to the
    Celestia network without downloading full blocks.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:26658
tags:
  - name: DAS
    description: Data Availability Sampling stats, sync state, and worker control.
paths:
  /:
    post:
      tags: [DAS]
      summary: Invoke DAS JSON-RPC Method
      description: |
        Exposes the `das.*` namespace including `das.SamplingStats` and
        `das.WaitCatchUp`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf: [{type: integer}, {type: string}]
        method:
          type: string
          enum:
            - das.SamplingStats
            - das.WaitCatchUp
        params:
          type: array
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc: {type: string}
        id: {}
        result: {}
        error:
          type: object
          properties:
            code: {type: integer}
            message: {type: string}
