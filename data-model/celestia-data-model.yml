description: >-
  Entity graph for the Celestia Node API, derived from the Go type names the provider's own
  OpenRPC document carries in every params[].description and result.description field. There
  is no components.schemas block to read — the OpenRPC declares zero reusable schemas, and
  each parameter carries an inline schema plus the concrete Go type as prose — so the
  relationships below are read from those type names and from the method signatures that
  join them, not invented. The shape of this model is unusual and worth stating plainly: the
  join key across the whole API is not an opaque id but a three-part coordinate,
  (height, namespace, commitment).
primary_key:
  name: retrieval tuple
  fields:
  - height
  - namespace
  - commitment
  note: >-
    Celestia's own published Agent Skill makes returning this tuple a hard requirement after
    any submission, because it is the only handle that retrieves the data later. There is no
    server-side blob id to look up.
entities:
- name: Blob
  type: blob.Blob
  module: blob
  description: >-
    The payload unit. Arbitrary bytes published under one namespace at one height, addressed
    afterwards by its commitment.
  fields:
  - namespace
  - data
  - share_version
  - commitment
  operations:
  - blob.Submit
  - blob.Get
  - blob.GetAll
  - blob.Subscribe
  relationships:
  - belongs_to: Namespace
    via: namespace
  - belongs_to: ExtendedHeader
    via: height
  - has_one: Commitment
    via: commitment
  - has_one: Proof
    via: blob.GetProof
- name: Namespace
  type: libshare.Namespace (da.Namespace in the deprecated da module)
  module: blob, share, da
  description: >-
    The tenant key. A rollup reads only the shares carrying its own namespace, which is what
    makes Namespaced Merkle Trees worth having.
  operations:
  - blob.GetAll
  - share.GetNamespaceData
  relationships:
  - has_many: Blob
    via: namespace
  - has_many: Share
    via: namespace
- name: Commitment
  type: blob.Commitment
  module: blob
  description: Content commitment over a blob's shares; the third element of the retrieval tuple.
  operations:
  - blob.Get
  - blob.GetProof
  - blob.Included
  - blob.GetCommitmentProof
  relationships:
  - belongs_to: Blob
    via: commitment
- name: Proof
  type: blob.Proof / blob.CommitmentProof
  module: blob
  description: Inclusion proof binding a blob or commitment to the data root at a height.
  operations:
  - blob.GetProof
  - blob.GetCommitmentProof
  - blob.Included
  relationships:
  - belongs_to: Blob
    via: commitment
  - belongs_to: ExtendedHeader
    via: height
- name: ExtendedHeader
  type: header.ExtendedHeader
  module: header
  description: >-
    Block header extended with the data availability header. The height it carries is the
    first element of the retrieval tuple and the join key for everything below the block.
