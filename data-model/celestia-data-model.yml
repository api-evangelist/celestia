derivation_notes:
- >-
  The OpenRPC declares 0 entries in components.schemas, so no schema reuse could be read
  from the document; every relationship above comes from a Go type name repeated across
  method signatures.
- >-
  The da.* module defines parallel types (da.Blob, da.ID, da.Commitment, da.Proof,
  da.Namespace) that mirror the blob/share entities through the generic modular DA
  interface. They are omitted as separate entities because all eight da methods are marked
  deprecated in the contract.
- >-
  The fraud module's BadEncodingProof entity is absent from this model: the namespace was
  removed in celestia-node v0.31.3 and carries no method in openrpc-v0.31.4.json.
