description: >-
  Celestia publishes no plans, tiers or price list, and this is a structural fact about the
  product rather than a gap in its marketing. There is no vendor account, no API key issued
  by Celestia, and no metered billing relationship: access to the Node API is access to a
  node the consumer runs, and the only thing that costs money is the on-chain fee paid in
  TIA when a PayForBlobs transaction is submitted. celestia.org publishes no /pricing page —
  its own llms.txt site index lists every public page and none of them is a pricing page.
